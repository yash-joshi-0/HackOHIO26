[package]
name = "llm-cluster"
default-run = "llm-cluster"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "meshthing"
path = "apps/desktop/src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
iroh = "1.4"
postcard = { version = "1", features = ["use-std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8.9"
futures-util = "0.3.34"
uuid = { version = "1.29.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
