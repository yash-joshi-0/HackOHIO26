name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Native profiling diagnostics
        if: matrix.os != 'windows-latest'
        run: python3 -m unittest discover -s experiments/model-validation -p 'test_*.py' -v
      - name: Clippy
        if: matrix.os != 'windows-latest'
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # Integration tests spawn two fake server examples. `--all-targets` builds examples as
        # test harnesses only, so build the standalone helper binaries first.
        run: |
          cargo build --example fake_llama_server --example fake_rpc_server --example fake_shard_runner
          cargo test --all-targets
